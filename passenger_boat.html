// ---------- HULL: lofted cross-sections (x = length, y = up, z = beam) ----------
const L=24,B=6.4,D=2.6; // length, beam, depth
const TS=[0,0.035,0.35,0.62,0.72,0.8,0.87,0.93,0.97,1],NS=TS.length-1; // stations: dense only where the hull curves (bow), none along the straight midbody
function section(t){ // t:0 stern .. 1 bow -> half-beam, keel depth, sheer height
  const bowT=Math.max(0,(t-0.62)/0.38), sternT=Math.max(0,(0.06-t)/0.06);
  const hb=B/2*(1-Math.pow(bowT,1.8))*(1-0.12*sternT);
  const keel=-D*(1-0.55*Math.pow(bowT,1.3)) + 0.25*sternT;
  const sheer=0.15+0.9*Math.pow(t,3);
  return {hb:Math.max(hb,0.04),keel,sheer};
}
// profile around half-section: from deck edge down to keel (normalized), slight flare + chine
const prof=[[1.0,1],[1.02,0.62],[0.82,0.18],[0,0]]; // deck edge, flare, bilge chine, keel: the hidden bottom gets just one facet per side
function buildHull(){
  const pos=[],idx=[],cols=[];const rows=[];
  for(let i=0;i<=NS;i++){const t=TS[i],s=section(t),x=-L/2+t*L,row=[];
    const pts=[];for(const [w,h] of prof)pts.push([w*s.hb,s.keel+h*(s.sheer-s.keel)]);
    // left side reversed + right side
    const ring=[...pts.map(p=>[p[0],p[1]])];const full=[...ring.map(p=>[-p[0],p[1]]),...ring.slice(0,-1).reverse().map(p=>[p[0],p[1]])]; // port deck edge → keel → starboard deck edge
    for(const [z,y] of full){row.push(pos.length/3);pos.push(x,y,z)}rows.push(row)}
  const n=rows[0].length;
  for(let i=0;i<NS;i++)for(let j=0;j<n-1;j++){const a=rows[i][j],b=rows[i+1][j],c=rows[i+1][j+1],d=rows[i][j+1];idx.push(a,b,d,b,c,d)}
  // transom
  const r0=rows[0];for(let j=1;j<n-1;j++)idx.push(r0[0],r0[j+1],r0[j]);
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setIndex(idx);
  g.computeVertexNormals();return g.toNonIndexed();
}
const hullGeo=buildHull();

   `vec3 hc=vHy<-1.15?vec3(0.33,0.03,0.02):vHy<-0.95?vec3(0.016,0.017,0.02):vHy<-0.12?vec3(0.013,0.08,0.24):vHy<0.0?vec3(0.78,0.46,0.02):vec3(0.9,0.9,0.87);
    float ps=1.55,px=mod(vHp.x+12.0,ps)-ps*0.5,pd=length(vec2(px,vHy+0.55));
    if(vHp.x>-8.8&&vHp.x<4.5&&abs(vHp.z)>1.5){hc=pd<0.15?mix(vec3(0.03,0.06,0.1),vec3(0.2,0.3,0.4),smoothstep(-0.15,0.15,vHy+0.55)):pd<0.2?vec3(0.55,0.57,0.6):hc;}
    float wl=smoothstep(0.0,0.06,abs(vHy+1.0));hc*=0.82+0.18*wl; // grime line at waterline
    vec4 diffuseColor = vec4( hc, opacity );`)};
add(hullGeo,hullMat);
// transom rub rail + stern name plate
{const s=section(0);box(0.12,0.18,s.hb*2+0.2,P.black,-L/2-0.04,s.sheer-0.55,0);box(0.04,0.3,2.4,P.white,-L/2-0.02,s.sheer-0.95,0);}

// main deck plate following the sheer

  for(let i=0;i<=NS;i++){const t=TS[i],s=section(t),x=-L/2+t*L,y=s.sheer-0.05;pos.push(x,y,-s.hb*0.99,x,y,s.hb*0.99)}
  for(let i=0;i<NS;i++){const a=i*2;idx.push(a,a+1,a+2,a+1,a+3,a+2)}
  deckG.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));deckG.setIndex(idx);deckG.computeVertexNormals();}

  add(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts),14,0.09,3),P.black);

  for(const fx of[-6,-1,4]){const s=section((fx+L/2)/L);const f=cyl(0.18,0.18,0.7,P.blue,fx,-0.2,sgn*(s.hb+0.2),5);box(0.02,0.5,0.02,P.rope,fx,0.25,sgn*(s.hb+0.2))}

// window band texture: framed panes with sky reflection + interior hint (2 tris per side instead of dozens of boxes)
function winTex(n,aspect){const c=document.createElement('canvas'),W=c.width=512,H=c.height=Math.max(32,Math.round(512/aspect));const x=c.getContext('2d');
  x.fillStyle='#eeeeea';x.fillRect(0,0,W,H);const pw=W/n;
  for(let i=0;i<n;i++){const px=i*pw+pw*0.07,w=pw*0.86,py=H*0.08,h=H*0.84;
    const g=x.createLinearGradient(0,py,0,py+h);g.addColorStop(0,'#5d84a3');g.addColorStop(0.45,'#2b465e');g.addColorStop(1,'#18293a');x.fillStyle=g;
    x.beginPath();x.roundRect?x.roundRect(px,py,w,h,h*0.18):x.rect(px,py,w,h);x.fill();
    x.fillStyle='rgba(255,255,255,0.18)';x.beginPath();x.moveTo(px+w*0.15,py);x.lineTo(px+w*0.4,py);x.lineTo(px+w*0.1,py+h);x.lineTo(px-w*0.15+w*0.1,py+h);x.fill();
    x.strokeStyle='#cfd2d3';x.lineWidth=Math.max(2,H*0.03);x.stroke();}
  const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;t.anisotropy=8;return t}
function winBand(x0,x1,y,h,z,s,n,g){const m=new THREE.Mesh(new THREE.PlaneGeometry(x1-x0,h),new THREE.MeshStandardMaterial({map:winTex(n,(x1-x0)/h),roughness:0.25,metalness:0.2}));
  m.position.set((x0+x1)/2,y,z);if(s<0)m.rotation.y=Math.PI;(g||boat).add(m);mats.push(m.material);return m}

  const g=new THREE.Group();boat.add(g);

  const wn=Math.floor((x1-x0)/1.1);
  for(const s of[-1,1])winBand(x0+0.25,x1-0.25,yb+h*0.58,h*0.5,s*(hw+0.005),s,wn,g);
  box(x1-x0+0.1,0.06,hw*2+0.1,P.steelD,(x0+x1)/2,yb+h*0.28,0,g); // trim stripe
  box(x1-x0+0.3,0.1,hw*2+0.3,P.white,(x0+x1)/2,yb+h+0.05,0,g); // roof lip
  return g}

}
// mast + radar + nav lights
const mx=3.0,my=y1+1.98;
cyl(0.07,0.09,2.4,P.white,mx,my+1.2,0,6);box(0.08,0.08,1.4,P.white,mx,my+1.7,0);
add(new THREE.SphereGeometry(0.1,6,3),P.yellow,mx,my+2.45,0);

box(0.12,0.08,1.6,P.white,0,0,0,radar);
for(const s of[-1,1]){box(0.12,0.25,0.12,P.redL,6.2,y0+0.9,s*2.6);} // side lights

// funnel
{const f=cyl(0.55,0.75,1.6,P.white,-1.0,y1+0.8,0,8);f.scale.set(1.5,1,1);f.rotation.z=0.12;
 const band=cyl(0.62,0.66,0.35,P.blue,-1.1,y1+1.25,0,8);band.scale.set(1.5,1,1);band.rotation.z=0.12;

 for(const zz of[-0.25,0.25])cyl(0.08,0.08,0.4,P.black,-1.2,y1+1.75,zz,6);}
// life rings on saloon walls, life raft canisters
for(const s of[-1,1]){for(const lx of[-5,0.5]){const lr=add(new THREE.TorusGeometry(0.28,0.08,3,6),P.orange,lx,y0+1.25,s*2.72);
    for(let q=0;q<4;q++){const st=box(0.1,0.17,0.17,P.white,lx+Math.cos(q*Math.PI/2+0.78)*0.28,y0+1.25+Math.sin(q*Math.PI/2+0.78)*0.28,s*2.74)}}
  for(const lx of[-7.6,-6.6]){const c=cyl(0.3,0.3,1.0,P.white,lx,y1+0.35,s*2.4,6);c.rotation.x=Math.PI/2;cyl(0.31,0.31,0.08,P.red,lx,y1+0.35,s*2.4,6).rotation.x=Math.PI/2;}
}

cyl(0.03,0.03,2.0,P.white,-11.7,1.2,0,3);box(0.9,0.55,0.02,P.red,-11.25,1.9,0);box(0.9,0.12,0.03,P.white,-11.25,1.9,0);
// foredeck: anchor winch, hatch, anchor
{const s=section(0.88);box(0.9,0.4,1.1,P.steelD,8.5,s.sheer+0.2,0);cyl(0.25,0.25,1.4,P.black,8.5,s.sheer+0.45,0,8).rotation.x=Math.PI/2;
 box(1.2,0.12,1.2,P.deckG,7.3,section(0.8).sheer+0.06,0);
 const anc=box(0.08,0.6,0.08,P.black,10.6,section(0.94).sheer-0.6,1.0);box(0.4,0.08,0.08,P.black,10.6,section(0.94).sheer-0.9,1.0);}
// passenger name board
for(const s of[-1,1])box(3.2,0.4,0.03,P.blue,4,y1+1.6,s*2.02);
// tender boat on davits (stern upper deck)
{const t=new THREE.Group();t.position.set(-8.2,y1+1.3,-1.6);boat.add(t);
 const tg=new THREE.CylinderGeometry(0.42,0.42,2.0,6,1,false,Math.PI/2,Math.PI);const th=add(tg,P.orange,0,0,0,t);th.rotation.z=Math.PI/2; // half-hex hull
 box(2.0,0.06,0.86,P.white,0,0.0,0,t);box(0.5,0.08,0.7,P.wood,0.2,0.05,0,t); // gunwale cap + thwart
 for(const dx of[-0.8,0.8]){cyl(0.04,0.04,1.3,P.steel,-8.2+dx,y1+0.65,-1.6,4);box(0.06,0.06,0.5,P.steel,-8.2+dx,y1+1.32,-1.6)}}

// ---------- PORT: enclosed ferry terminal (no open-air passenger areas; boarding via covered gangway) ----------
const port=new THREE.Group();S.add(port);
const Q={conc:M(0xbdb8ad,0.95),concD:M(0x8c887f,0.95),asph:M(0x3d3f42,0.95),rub:M(0x1d1e20,0.8),stone:M(0x7d786e,1),roof:M(0x55606a,0.6,0.3),
 clad:M(0xdcdcd6,0.6),blue:M(0x2c6eb5,0.5),yel:M(0xe5b52a,0.6),steel:M(0x9aa0a6,0.4,0.7),grass:M(0x6f9a43,1)};

  x.strokeStyle='#a6a197';x.lineWidth=2;for(let i=0;i<1024;i+=64){x.beginPath();x.moveTo(i,0);x.lineTo(i,256);x.stroke()}
  x.fillStyle='#e5b52a';x.fillRect(0,0,1024,14);for(let i=0;i<1024;i+=40){x.fillStyle='#222';x.beginPath();x.moveTo(i,14);x.lineTo(i+20,14);x.lineTo(i+30,24);x.lineTo(i+10,24);x.fill()}
  x.fillStyle='#f2efe6';x.font='bold 40px sans-serif';x.fillText('BERTH 1',440,120);

line(new THREE.Vector3(4,qy+0.4,qz0+0.6),new THREE.Vector3(9.5,section(0.89).sheer+0.3,1.6));
