import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {mergeGeometries} from 'three/addons/utils/BufferGeometryUtils.js';

/* ───────────── constants ───────────── */
const DUR=60, FH=3.2, Y0=0.6, NS=10, P=1.9, T0=3.0;      // storeys, cycle length, first crane cycle
const BX=7.5, BZ=4.5;                                      // building half extents
const CR={x:-14,z:-3};                                     // tower-crane mast position
const DIS0=46.3, DIS1=55;                                  // scaffold dismantle window
const LT=17;                                               // scaffold lifts (2 m each)

/* ───────────── helpers ───────────── */
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));

const rand=rng(1234);

/* ───────────── renderer / scene ───────────── */
const R=new THREE.WebGLRenderer({antialias:true});R.localClippingEnabled=true;R.setPixelRatio(Math.min(devicePixelRatio,2));R.setSize(innerWidth,innerHeight);
R.shadowMap.enabled=true;R.shadowMap.type=THREE.PCFSoftShadowMap;R.toneMapping=THREE.ACESFilmicToneMapping;R.toneMappingExposure=1.0;
document.body.appendChild(R.domElement);
const S=new THREE.Scene();S.background=new THREE.Color();S.fog=new THREE.Fog(0x9bc4ea,140,520);
const C=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,0.5,1500);
const O=new OrbitControls(C,R.domElement);O.enableDamping=true;O.maxPolarAngle=1.52;O.minDistance=8;O.maxDistance=400;
const hemi=new THREE.HemisphereLight(0xcfe3ff,0x6b5a45,1.0);S.add(hemi);
const sun=new THREE.DirectionalLight(0xfff0d8,2.6);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-62,right:62,top:62,bottom:-62,near:1,far:320});sun.shadow.bias=-0.0004;sun.shadow.normalBias=0.06;S.add(sun,sun.target);

/* ───────────── procedural textures ───────────── */
function h2(x,y,s){let h=(Math.imul(x|0,374761393)+Math.imul(y|0,668265263)+Math.imul(s|0,1274126177))|0;h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967295}
function vn(x,y,s,p){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf),w=n=>((n%p)+p)%p;

function fbm(x,y,s,o,p){let a=.5,f=1,t=0;for(let i=0;i<o;i++){t+=a*vn(x*f,y*f,s+i*17,p*f);f*=2;a*=.5}return t}
function toTex(c,srgb){const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.anisotropy=8;if(srgb)t.colorSpace=THREE.SRGBColorSpace;return t}
/* fn(u,v,px,py) -> [r,g,b,a,height] ; v points up. returns colour + height (bump) maps */
function makeMaps(w,h,fn){
  const cc=document.createElement('canvas'),hc=document.createElement('canvas');cc.width=hc.width=w;cc.height=hc.height=h;
  const cx=cc.getContext('2d'),hx=hc.getContext('2d'),ci=cx.createImageData(w,h),hi=hx.createImageData(w,h);
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){const o=fn(x/w,1-y/h,x,y),i=(y*w+x)*4;
    ci.data[i]=o[0];ci.data[i+1]=o[1];ci.data[i+2]=o[2];ci.data[i+3]=o[3]??255;
    const hv=clamp(o[4])*255;hi.data[i]=hi.data[i+1]=hi.data[i+2]=hv;hi.data[i+3]=255}

}
const conc=makeMaps(512,512,(u,v,x,y)=>{          // board-formed concrete: form-ties, panel seams, pitting
  const n=fbm(u*8,v*8,3,5,8),n2=fbm(u*32,v*32,9,3,32);let b=.62+(n-.5)*.35+(n2-.5)*.12,ht=.6+(n-.5)*.3;

  const fu=(u*4)%1,fx=fu-.5,fy=fv-.5;if(Math.hypot(fx,fy)<.022){b*=.45;ht=.1}
  if(h2(x,y,5)>.992){b*=.6;ht*=.5}
  return[b*255,b*252,b*244,255,ht]});
const panel=makeMaps(512,512,(u,v)=>{              // precast cladding module (3 m × 3.2 m): reveals + staining
  const n=fbm(u*6,v*6,4,4,6),st=fbm(u*40,v*3,11,3,40);let b=.9+(n-.5)*.12-(st-.5)*.10*(1-v),ht=.8;
  const g=(v*8)%1;if(Math.min(g,1-g)<.016){b*=.78;ht=.25}
  const e=Math.min(u,1-u);if(e<.006){b*=.8;ht=.3}
  return[b*242,b*237,b*226,255,ht]});
const ground=makeMaps(512,512,(u,v,x,y)=>{
  const n=fbm(u*8,v*8,6,5,8);let k=.7+n*.6;const g=h2(x,y,7);
  const r=118*k+(g>.9?30:0),gr=96*k+(g>.9?28:0),b=70*k+(g>.9?24:0);return[r,gr,b,255,.4+n*.5]});

const netTex=(()=>{const c=document.createElement('canvas');c.width=c.height=64;const g=c.getContext('2d');g.strokeStyle='#2f9a54';g.lineWidth=3;

  g.fillStyle='#3fc46d';for(const a of[0,32])for(const b of[0,32]){g.fillRect(a-2,b-2,5,5)}return toTex(c,true)})();

const [skyTex,skyEm]=(()=>{const mk=lit=>{const c=document.createElement('canvas');c.width=256;c.height=512;const g=c.getContext('2d'),r=rng(77);
  g.fillStyle=lit?'#000':'#2b3544';g.fillRect(0,0,256,512);
  for(let i=0;i<8;i++)for(let j=0;j<16;j++){const on=r()>.62;g.fillStyle=lit?(on?'#ffd590':'#000'):(on?'#d8c48a':'#5b6f86');g.fillRect(i*32+6,j*32+8,20,16)}
  return toTex(c,true)};return[mk(false),mk(true)]})();

/* ───────────── materials ───────────── */

const mFrame=new THREE.MeshStandardMaterial({color:0x252b32,metalness:.55,roughness:.4});
const mSteel=new THREE.MeshStandardMaterial({color:0xc2c8cf,metalness:.7,roughness:.4});
const mWood=new THREE.MeshStandardMaterial({map:wood.map,roughness:.8});
const mNet=new THREE.MeshStandardMaterial({map:netTex,alphaTest:.35,side:THREE.DoubleSide,roughness:.9});
const mYel=new THREE.MeshStandardMaterial({color:0xf2b01e,roughness:.5,metalness:.25});
const mDark=new THREE.MeshStandardMaterial({color:0x2f343b,roughness:.6,metalness:.4});
const mGlassB=new THREE.MeshStandardMaterial({color:0x4aa3d8,roughness:.1,metalness:.6});
const mRebar=new THREE.MeshStandardMaterial({color:0x6a4330,roughness:.7,metalness:.4});
const clipPlane=new THREE.Plane(new THREE.Vector3(0,-1,0),1e4);[mConc,mPanel,mFrame,mDark].forEach(m=>m.clippingPlanes=[clipPlane]);
let scan=true,cutNow=1;
function uvBox(g,k=.25){const p=g.attributes.position,n=g.attributes.normal,uv=g.attributes.uv;
  for(let i=0;i<p.count;i++){const ax=Math.abs(n.getX(i)),ay=Math.abs(n.getY(i));let u,v;
    if(ay>.5){u=p.getX(i);v=p.getZ(i)}else if(ax>.5){u=p.getZ(i);v=p.getY(i)}else{u=p.getX(i);v=p.getY(i)}uv.setXY(i,u*k,v*k)}return g}

/* ───────────── instancing helpers ───────────── */
const _m=new THREE.Matrix4(),_q=new THREE.Quaternion(),_p=new THREE.Vector3(),_s=new THREE.Vector3(),_e=new THREE.Euler(),_a=new THREE.Vector3(),_b=new THREE.Vector3(),_d=new THREE.Vector3(),Zv=new THREE.Vector3(0,0,1);

function strut(mesh,i,ax,ay,az,bx,by,bz,t,r=1){          // unit-box tube from a to b, shrinks about its midpoint by r
  _a.set(ax,ay,az);_b.set(bx,by,bz);_d.subVectors(_b,_a);const len=_d.length();_p.addVectors(_a,_b).multiplyScalar(.5);
  if(len<1e-5){_q.identity()}else{_d.divideScalar(len);_q.setFromUnitVectors(Zv,_d)}
  _s.set(Math.max(t*r,E),Math.max(t*r,E),Math.max(len*r,E));_m.compose(_p,_q,_s);mesh.setMatrixAt(i,_m)}
function strutG(a,b,t){const A=new THREE.Vector3(...a),B=new THREE.Vector3(...b),d=new THREE.Vector3().subVectors(B,A),len=d.length();
  const g=new THREE.BoxGeometry(t,t,len);_q.setFromUnitVectors(Zv,d.normalize());_m.compose(A.clone().add(B).multiplyScalar(.5),_q,new THREE.Vector3(1,1,1));g.applyMatrix4(_m);return g}
const inst=(geo,mat,n,cast=true,rec=true)=>{const m=new THREE.InstancedMesh(geo,mat,n);m.frustumCulled=false;m.castShadow=cast;m.receiveShadow=rec;m.instanceMatrix.setUsage(THREE.DynamicDrawUsage);S.add(m);return m};
const UB=new THREE.BoxGeometry(1,1,1);

/* ───────────── ground, site, skyline ───────────── */
{const g=new THREE.Mesh(new THREE.PlaneGeometry(900,900),new THREE.MeshStandardMaterial({map:ground.map,bumpMap:ground.bump,bumpScale:3,roughness:1}));
  g.rotation.x=-Math.PI/2;g.receiveShadow=true;ground.map.repeat.set(112,112);ground.bump.repeat.set(112,112);S.add(g);
  const pit=new THREE.Mesh(new THREE.PlaneGeometry(24,17),new THREE.MeshStandardMaterial({color:0x3f3226,roughness:1}));pit.rotation.x=-Math.PI/2;pit.position.y=.02;pit.receiveShadow=true;S.add(pit);
  const road=new THREE.Mesh(new THREE.PlaneGeometry(900,14),new THREE.MeshStandardMaterial({color:0x34373c,roughness:.95}));road.rotation.x=-Math.PI/2;road.position.set(0,.03,34);road.receiveShadow=true;S.add(road);
  /* hoarding fence */
  const FX0=-24,FX1=22,FZ0=-17,FZ1=20,fp=[];
  for(let x=FX0;x<FX1;x+=2.5){fp.push([x+1.25,FZ0,0],[x+1.25,FZ1,0])}for(let z=FZ0;z<FZ1;z+=2.5){fp.push([FX0,z+1.25,Math.PI/2],[FX1,z+1.25,Math.PI/2])}
  const fence=inst(UB,new THREE.MeshStandardMaterial({color:0x6f8196,roughness:.7,metalness:.2}),fp.length);
  fp.forEach((f,i)=>{if(f[2]===0)put(fence,i,f[0],1,f[1],2.45,2,.06);else put(fence,i,f[0],1,f[1],.06,2,2.45,0)});fence.instanceMatrix.needsUpdate=true;
  /* site containers + sand pile */
  [[14,14,0x2f6db0],[19,14,0xb5472e],[14,-13,0x4a8a52]].forEach(([x,z,c])=>{const m=shadowed(new THREE.Mesh(new THREE.BoxGeometry(6,2.6,2.4),new THREE.MeshStandardMaterial({color:c,roughness:.6,metalness:.3})));m.position.set(x,1.3,z);S.add(m)});
  const sand=shadowed(new THREE.Mesh(new THREE.ConeGeometry(3,2,12),new THREE.MeshStandardMaterial({color:0xc9b27f,roughness:1})));sand.position.set(-19,1,-12);S.add(sand);
}
const skyline=[];
{const r=rng(5);for(let i=0;i<40;i++){const a=r()*Math.PI*2,d=95+r()*70,w=14+r()*16,dd=14+r()*16,h=16+r()*r()*80;
  const g=new THREE.BoxGeometry(w,h,dd);g.translate(0,h/2,0);const p=g.attributes.position,n=g.attributes.normal,uv=g.attributes.uv;
  for(let k=0;k<p.count;k++){const roof=Math.abs(n.getY(k))>.5;if(roof)uv.setXY(k,.02,.02);else uv.setXY(k,(Math.abs(n.getX(k))>.5?p.getZ(k):p.getX(k))/24,p.getY(k)/51.2)}
  const mt=new THREE.MeshStandardMaterial({color:new THREE.Color().setHSL(.58,.1,.55+r()*.2),map:skyTex,emissive:0xffffff,emissiveMap:skyEm,emissiveIntensity:0,roughness:.8});
  const m=shadowed(new THREE.Mesh(g,mt));m.position.set(Math.cos(a)*d+0,0,Math.sin(a)*d+10);S.add(m);skyline.push(mt)}}

/* ───────────── schedule: crane cycles drive every build event ───────────── */
const seq=[['S',1]];for(let s=2;s<=NS;s++){seq.push(['S',s],['F',s-1])}seq.push(['F',NS],['R',1],['R',2]);
const PICK={S:[-8,13],F:[-13,13.5],R:[-10,13]};
const TG_F=[[-5,2.4],[5,-2.4],[-1,2.6],[2,-2.6],[-6,-1.8],[6,1.6],[0,.2],[-3,2.6],[3,-2.2],[-5,0]];
const PAY={S:{h:.5},F:{h:1.2},R1:{h:1.6},R2:{h:1.8}};
const cycles=seq.map(([k,s],i)=>{const key=k==='R'?'R'+s:k;
  return{kind:k,key,s,i,R:T0+(i+1)*P,pick:PICK[k],pay:PAY[key],yPlace:Y0+(k==='R'?NS:s)*FH,
    tgt:k==='S'?[-2.5,.4]:k==='F'?TG_F[(s-1)%10]:s===1?[4,-1]:[-3,1.5]}});

/* ───────────── structure ───────────── */
const found=shadowed(new THREE.Mesh(uvBox(new THREE.BoxGeometry(17,.6,11)),mConc));S.add(found);
const NRX=17,NRZ=27,rebar=inst(UB,mRebar,NRX+NRZ,false,false);
const slabs=[];for(let s=1;s<=NS;s++){const m=shadowed(new THREE.Mesh(uvBox(new THREE.BoxGeometry(15,.3,9)),mConc));S.add(m);slabs[s]=m}
const colGeo=uvBox(new THREE.BoxGeometry(.4,1,.4).translate(0,.5,0),.5);
const colPos=[];for(let i=0;i<6;i++)for(let j=0;j<4;j++)colPos.push([-7.05+i*2.82,-4.05+j*2.7]);
const cols=inst(colGeo,mConc,colPos.length*NS);
const core=shadowed(new THREE.Mesh(uvBox(new THREE.BoxGeometry(4,1,3).translate(0,.5,0)),mConc));core.position.set(3,Y0,0);S.add(core);

/* ───────────── facade: panels + frames + interior-mapped glass ───────────── */

const frameGeo=mergeGeometries([modBox(.07,1.8,.12,-.93,1.8,.03),modBox(.07,1.8,.12,.93,1.8,.03),modBox(1.96,.07,.12,0,2.665,.03),modBox(1.96,.07,.12,0,.935,.03),
  modBox(.04,1.8,.1,0,1.8,.02),modBox(1.9,.04,.1,0,1.95,.02),modBox(2.1,.06,.2,0,.9,.12)]);

const MODS=[];

const tints=[0xffffff,0xffffff,0xffffff,0xffffff,0xf0dcc8,0xd9a58c,0xbfc9d2].map(c=>new THREE.Color(c));
const panelM=inst(panelGeo,mPanel,MODS.length),frameM=inst(frameGeo,mFrame,MODS.length);
const seedA=new Float32Array(MODS.length);MODS.forEach((m,i)=>{seedA[i]=m.seed;panelM.setColorAt(i,tints[Math.floor(rand()*tints.length)])});

  for(let i=0;i<10;i++){const g=new THREE.Group();const b=shadowed(new THREE.Mesh(new THREE.CapsuleGeometry(.17,.55,4,8),body));b.position.y=.55;
    const h=shadowed(new THREE.Mesh(new THREE.SphereGeometry(.12,10,8),skin));h.position.y=1.14;
    const c=new THREE.Mesh(new THREE.SphereGeometry(.14,10,8,0,Math.PI*2,0,Math.PI/2),hat);c.position.y=1.17;g.add(b,h,c);S.add(g);workers.push(g)}}
const perim=SEG.reduce((a,s)=>a+s.len,0);
function updateWorkers(T,F){
  workers.forEach((w,i)=>{let li=F-1.4-2*(i%4);const lq=Math.floor(li)+sm((li-Math.floor(li))*4-3);
    if(li<0||lq>F-.3){w.visible=false;return}w.visible=true;
    let s=((i*.173+T*.011*(1+.3*(i%3)))%1)*perim,k=0;while(s>SEG[k].len){s-=SEG[k].len;k=(k+1)%NSEG}
    const g=SEG[k],f=s/g.len;w.position.set(lerp(g.a[0],g.b[0],f)-g.nx*.45,Y0+2*lq+.12+Math.abs(Math.sin(T*9+i))*.03,lerp(g.a[1],g.b[1],f)-g.nz*.45);w.rotation.y=Math.atan2(g.dx,g.dz)})}

/* ───────────── sky / light ───────────── */
const SKY=[[0,[.96,.70,.54]],[.12,[.66,.80,.94]],[.5,[.53,.75,.95]],[.78,[.94,.63,.44]],[.9,[.42,.35,.55]],[1,[.07,.10,.22]]];
function skyAt(K){for(let i=1;i<SKY.length;i++)if(K<=SKY[i][0]){const a=SKY[i-1],b=SKY[i],f=(K-a[0])/(b[0]-a[0]);return a[1].map((v,j)=>lerp(v,b[1][j],f))}return SKY[SKY.length-1][1]}
function updateSky(T){const K=T/DUR,c=skyAt(K),ang=lerp(.18,2.95,K),el=Math.sin(ang),night=sm((K-.78)/.17);
  S.background.setRGB(c[0],c[1],c[2],THREE.SRGBColorSpace);S.fog.color.copy(S.background);
  sun.position.set(Math.cos(ang)*90,Math.max(el,.03)*80+3,38);sun.target.position.set(0,10,0);
  sun.intensity=lerp(.15,2.8,clamp(el*2.2))*(1-night*.85);sun.color.setRGB(1,lerp(.6,.95,clamp(el*2)),lerp(.4,.88,clamp(el*2)));
  hemi.intensity=lerp(.28,1.05,clamp(el*2))*(1-night*.45)+.1;
  U.uNight.value=night;U.uSky.value.set(c[0],c[1],c[2]);U.uSun.value.copy(sun.position).normalize();
  skyline.forEach(m=>m.emissiveIntensity=night*1.3)}

/* ───────────── per-frame world update ───────────── */
const DIM=[];
const hook0=new THREE.Vector3(),hookTop=new THREE.Vector3(),trolleyP=new THREE.Vector3();
function update(Treal){
  updateSky(Treal);updateScan(Treal);
  const T=scan?SCAN_T:Treal;
  /* foundation */
  const pour=sm((T-1.2)/1.8);found.visible=T>1.2;found.scale.y=Math.max(pour,E);found.position.y=.3*pour;
  rebar.visible=T<3.5;if(rebar.visible){for(let i=0;i<NRX;i++){const r=sm((T-.3-i*.035)/.5);put(rebar,i,0,.18,-5+i*.6,16*r,.025,.025)}
    for(let i=0;i<NRZ;i++){const r=sm((T-.5-i*.025)/.5);put(rebar,NRX+i,-8+i*.6,.22,0,.025,.025,10*r)}rebar.instanceMatrix.needsUpdate=true}
  /* slabs */
  for(let s=1;s<=NS;s++){const p=sm((T-slabT[s])/.6),m=slabs[s];m.visible=T>slabT[s];const k=.05+.95*p;m.scale.set(k,1,k);m.position.set(0,Y0+s*FH-.15-(1-p)*.8,0)}
  /* columns + core */
  let ci=0,coreH=0;for(let s=1;s<=NS;s++){const g=sm((T-colStart[s])/1.3);coreH+=FH*g;for(const[x,z]of colPos)put(cols,ci++,x,Y0+(s-1)*FH,z,1,FH*g,1)}
  cols.instanceMatrix.needsUpdate=true;core.scale.y=Math.max(coreH+3*sm((T-roofT1)/1),E);
  /* facade */
  MODS.forEach((m,i)=>{const p=clamp((T-facT[m.s]-m.delay)/.6),e=1-Math.pow(1-p,3),y=Y0+(m.s-1)*FH+(1-e)*1.4;
    put(panelM,i,m.x,y,m.z,e,e,e,m.ry);put(frameM,i,m.x,y,m.z,e,e,e,m.ry);put(glassM,i,m.x,y,m.z,e,e,e,m.ry)});
  panelM.instanceMatrix.needsUpdate=frameM.instanceMatrix.needsUpdate=glassM.instanceMatrix.needsUpdate=true;
  {let i=0;for(let s=1;s<=NS;s++){const p=clamp((T-facT[s]-.25)/.6),e=1-Math.pow(1-p,3),y=Y0+(s-1)*FH+(1-e)*1.4+1.6*e;
    for(const[sx,sz]of[[1,1],[1,-1],[-1,1],[-1,-1]])put(cornerM,i++,sx*(BX+.125),y,sz*(BZ+.125),e,e,e)}cornerM.instanceMatrix.needsUpdate=true}
  /* roof */
  {const p=sm((T-roofT1)/.8);const pars=[[0,BZ+.125,15.5,.25],[0,-(BZ+.125),15.5,.25],[BX+.125,0,.25,9.5],[-(BX+.125),0,.25,9.5]];
    pars.forEach((q,i)=>put(parapet,i,q[0],RY+.5*p,q[1],q[2]*Math.min(1,p*50),p,q[3]*Math.min(1,p*50)));parapet.instanceMatrix.needsUpdate=true;
    const a=sm((T-roofT1)/.5);acUnit.visible=a>0;acUnit.scale.setScalar(Math.max(a,E));acUnit.position.set(4,RY+.8*a,-1);
    const b=sm((T-roofT2)/.5);tank.visible=b>0;tank.scale.setScalar(Math.max(b,E));tank.position.set(-3,RY+.9*b,1.5);
    const an=sm((T-roofT2-.3)/1.2);antenna.visible=an>0;antenna.scale.y=Math.max(an,E);antenna.position.set(3,RY+3.5*an,0);
    beacon.visible=an>.95;beacon.position.set(3,RY+7.2,0);beacon.scale.setScalar(.6+.4*Math.max(0,Math.sin(T*6)))}
  if(!scan){
  /* scaffold */
  const F=scafF(T);updateScaffold(F);updateWorkers(T,F);
  /* crane */
  const Jy=jibY(T),st=craneState(T),lag=craneState(T-.2);
  const nF=Math.floor((Jy-1.4)/2),rem=(Jy-1.4)-nF*2;
  for(let i=0;i<NMAST;i++){if(i<nF)put(mast,i,CR.x,i*2+1,CR.z,1,1,1);else if(i===nF)put(mast,i,CR.x,nF*2+rem/2,CR.z,1,rem/2,1);else put(mast,i,CR.x,0,CR.z,E,E,E)}mast.instanceMatrix.needsUpdate=true;
  climb.position.set(CR.x,Jy-2.6,CR.z);climb.visible=Jy>10;
  slew.position.set(CR.x,Jy,CR.z);slew.rotation.y=-st.az;slew.userData.lamp.visible=Math.sin(T*3)>-.2;
  const jf=sm((T-2)/.8);slew.scale.set(jf||E,1,1);
  trolleyP.set(CR.x+st.r*Math.cos(st.az),Jy-.2,CR.z+st.r*Math.sin(st.az));trolley.position.copy(trolleyP);trolley.rotation.y=-st.az;trolley.visible=jf>0;
  hook0.set(CR.x+lag.r*Math.cos(lag.az),st.yh,CR.z+lag.r*Math.sin(lag.az));hook.position.copy(hook0);hook.visible=jf>0;
  hookTop.set(hook0.x,hook0.y+.35,hook0.z);_d.subVectors(trolleyP,hookTop).setY(trolleyP.y-.25-hookTop.y);
  {const a=hookTop,b=_b.set(trolleyP.x,trolleyP.y-.25,trolleyP.z),len=a.distanceTo(b);rope.position.addVectors(a,b).multiplyScalar(.5);rope.scale.set(1,len,1);
    rope.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),_a.subVectors(b,a).normalize());rope.visible=jf>0}
  /* ties from mast to building */
  [11,22,33].forEach((y,i)=>{const e=sm((topY(T)-y)/1.2);strut(ties,i*2,CR.x+.8,y,CR.z,-7.7,y,CR.z-1.4,.14,e);strut(ties,i*2+1,CR.x+.8,y,CR.z,-7.7,y,CR.z+1.4,.14,e)});ties.instanceMatrix.needsUpdate=true;
  /* payload + slings */
  Object.values(PL).forEach(o=>o.visible=false);slings.visible=false;
  if(st.k>=0&&st.k<cycles.length){const c=st.c,g=PL[c.key],h=c.pay.h;g.visible=true;
    if(st.on){g.position.set(hook0.x,hook0.y-1.3-h,hook0.z);g.rotation.y=-lag.az;g.scale.setScalar(1);
      g.updateMatrixWorld(true);const pos=slings.geometry.attributes.position,w={S:1.6,F:1.2,R1:1.0,R2:.6}[c.key],dd={S:.7,F:.5,R1:.8,R2:.6}[c.key];let j=0;
      for(const[sx,sz]of[[1,1],[1,-1],[-1,1],[-1,-1]]){_b.set(sx*w,h,sz*dd);g.localToWorld(_b);pos.setXYZ(j++,hook0.x,hook0.y-.35,hook0.z);pos.setXYZ(j++,_b.x,_b.y,_b.z)}
      pos.needsUpdate=true;slings.visible=true}
    else{g.position.set(c.pick[0],.05,c.pick[1]);g.rotation.y=.25;g.scale.setScalar(Math.max(sm(st.u/.1),E))}}
  }
}

/* ───────────── camera ───────────── */
let autoCam=true,firstCam=true;const camT=new THREE.Vector3(),camP=new THREE.Vector3();
function driveCam(T,dt){const K=T/DUR,top=scan?Math.min(cutNow,RY):topY(T),th=.75+K*2.4,ph=.30+.1*Math.sin(K*3),rad=62+top*1.0+12*sm((T-52)/6),ty=6+top*.5+(T>46?6:0);
  camT.set(0,ty,0);camP.set(Math.sin(th)*Math.cos(ph)*rad,ty+Math.sin(ph)*rad,Math.cos(th)*Math.cos(ph)*rad);
  if(firstCam){C.position.copy(camP);O.target.copy(camT);firstCam=false}else{const k=1-Math.exp(-dt*3);C.position.lerp(camP,k);O.target.lerp(camT,k)}}

/* ───────────── UI / loop ───────────── */
let T=0,playing=true,speed=1,dragging=false;
const $=id=>document.getElementById(id);
const fmt=t=>`0:${String(Math.floor(t)).padStart(2,'0')} / 1:00`;
function phaseText(T){if(scan){const st=clamp(Math.floor((cutNow-Y0)/FH)+1,1,NS);return['Scan · slice at '+cutNow.toFixed(1)+' m',`storey ${st} / ${NS} · open section patched with scan texture`]}
  let n=0;for(let s=1;s<=NS;s++)if(T>=slabT[s])n=s;
  const c=T>=T0&&T<T_CYC?cycles[Math.min(cycles.length-1,Math.floor((T-T0)/P))]:null;
  const lift=c?({S:'lifting precast floor planks',F:'lifting facade glazing crates',R:'lifting roof plant'})[c.kind]:'';
  if(T<3.2)return['Site prep',`rebar mat, foundation pour, crane erection`];
  if(T<T_CYC)return[`Structure · storey ${Math.max(n,1)} / ${NS}`,`crane ${lift}`];
  if(T<DIS0)return['Topping out','roof plant set, crane parking'];
  if(T<DIS1)return['Dismantling scaffold','top-down strip-out'];
  return['Handover','interior lights on']}
$('play').onclick=()=>{if(T>=DUR)T=0;playing=!playing;$('play').textContent=playing?'⏸':'▶'};
$('rst').onclick=()=>{T=0;playing=true;$('play').textContent='⏸'};
$('spd').onchange=e=>speed=+e.target.value;
$('scrub').oninput=e=>{T=+e.target.value;dragging=true};$('scrub').onchange=()=>dragging=false;
$('cbScaf').onchange=e=>{steelM.visible=deckM.visible=e.target.checked&&!scan;netM.visible=e.target.checked&&!scan&&$('cbNet').checked};
$('cbNet').onchange=e=>netM.visible=e.target.checked&&$('cbScaf').checked&&!scan;
const craneObjs=[mast,base,...craneX,climb,slew,trolley,rope,hook,slings,ties,...workers,...Object.values(PL)];
function setMode(m){scan=m==='scan';craneObjs.forEach(o=>o.visible=!scan);const sc=$('cbScaf').checked;steelM.visible=deckM.visible=!scan&&sc;netM.visible=!scan&&sc&&$('cbNet').checked;if(!scan){cap.visible=glow.visible=false}}
$('mode').onchange=e=>{setMode(e.target.value);T=0};
$('cbCam').onchange=e=>{autoCam=e.target.checked};
O.addEventListener('start',()=>{autoCam=false;$('cbCam').checked=false});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();$('play').click()}else if(e.key==='r'||e.key==='R')$('rst').click()});
$('save').onclick=()=>{[['concrete_color',conc.cc],['concrete_height',conc.hc],['facade_panel_color',panel.cc],['facade_panel_height',panel.hc],['ground_color',ground.cc],['ground_height',ground.hc]].forEach(([n,c],i)=>
  setTimeout(()=>c.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n+'.png';a.click()}),i*250))};
addEventListener('resize',()=>{R.setSize(innerWidth,innerHeight);C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix()});

let last=performance.now(),hudAcc=0;
function frame(now){const dt=Math.min(.1,(now-last)/1000);last=now;
  if(playing){T=Math.min(DUR,T+dt*speed);if(T>=DUR){playing=false;$('play').textContent='▶'}}
  update(T);if(autoCam)driveCam(T,dt);O.update();
  sun.shadow.camera.updateProjectionMatrix();
  if(!dragging)$('scrub').value=T;$('tc').textContent=fmt(T);
  hudAcc+=dt;if(hudAcc>.1){hudAcc=0;const[a,b]=phaseText(T);$('phase').textContent=a;$('sub').textContent=b}
  R.render(S,C);requestAnimationFrame(frame)}
window.tl={get T(){return T},set T(v){T=v},pause(){playing=false}};
setMode('scan');
requestAnimationFrame(frame);
</script></body></html>
