// ---- BAKE 5 CARGO MESHES (20/40/60/80/100%) with hidden-face culling ----
const HX=3,HY=1.25,HZ=1.2;
function bakeBoxes(set){const occ=new Set(set.map(b=>b.cell.join()));
  const has=(a,r,t)=>occ.has([a,r,t].join()),P=[],U=[],Cc=[];let faces=0;
  // face: axis 0/1/2, sign, atlas tile

  for(const b of set){const[bay,r,t]=b.cell,col=new THREE.Color(b.c);
    const nb=[has(bay+1,r,t),has(bay-1,r,t),has(bay,r,t+1),true /*bottom: deck or box below*/,has(bay,r+1,t),has(bay,r-1,t)];
    F.forEach(([ax,sg,tile],fi)=>{if(nb[fi])return;faces++;
      const h=[HX,HY,HZ],ua=ax==1?0:(ax==0?2:0),va=ax==1?2:1; // in-plane axes
      const q=[[-1,-1],[1,-1],[1,1],[-1,1]].map(([u,v])=>{const p=[b.x,b.y,b.z];p[ax]+=sg*h[ax];p[ua]+=u*h[ua];p[va]+=v*h[va];return[p,(tile+(u+1)/2)/3,(v+1)/2];});

      const a=q[0][0],bb=q[1][0],c=q[2][0],e1=[bb[0]-a[0],bb[1]-a[1],bb[2]-a[2]],e2=[c[0]-a[0],c[1]-a[1],c[2]-a[2]];
      const nx=[e1[1]*e2[2]-e1[2]*e2[1],e1[2]*e2[0]-e1[0]*e2[2],e1[0]*e2[1]-e1[1]*e2[0]][ax]*sg;
      const ord=nx>0?[0,1,2,0,2,3]:[0,2,1,0,3,2];

  g.setAttribute('uv',new THREE.Float32BufferAttribute(U,2));g.setAttribute('color',new THREE.Float32BufferAttribute(Cc,3));g.computeVertexNormals();

// everything static is built from primitives in a temp group, then baked into ONE vertex-coloured mesh
function bakeGroup(g,material){g.updateMatrixWorld(true);const P=[],Cc=[];
  g.traverse(m=>{if(!m.isMesh)return;const geo=(m.geometry.index?m.geometry.toNonIndexed():m.geometry.clone()).applyMatrix4(m.matrixWorld);
    const a=geo.attributes.position.array,c=m.material.color;
    for(let i=0;i<a.length;i+=9){const y=Math.max(a[i+1],a[i+4],a[i+7]);
      const ny=(a[i+3]-a[i])*(a[i+8]-a[i+2])-(a[i+5]-a[i+2])*(a[i+6]-a[i]); // y of face normal (unnormalised, sign only)
      if(ny>1e-6&&y<=QY+0.25)continue; // downward face on the ground: never visible
      for(let j=0;j<9;j++)P.push(a[i+j]);for(let j=0;j<3;j++)Cc.push(c.r,c.g,c.b);}});
  const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.Float32BufferAttribute(P,3));geo.setAttribute('color',new THREE.Float32BufferAttribute(Cc,3));geo.computeVertexNormals();
  const m=new THREE.Mesh(geo,material||new THREE.MeshStandardMaterial({vertexColors:true,flatShading:true,roughness:.85}));m.castShadow=m.receiveShadow=true;return m;}

  m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.normalize());p.add(m);return m;}
