function dec(b,T){const s=atob(b),u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return new T(u.buffer)}
function mk(parts){let nv=0,nt=0;parts.forEach(p=>{nv+=p.v;nt+=p.n});const P=new Float32Array(nv*3),F=new Uint32Array(nt*3),C=new Array(nt),N=new Float32Array(nv*3);let vo=0,to=0;
parts.forEach(p=>{const pp=dec(p.p,Int16Array),ff=dec(p.f,Uint16Array);for(let i=0;i<pp.length;i++)P[vo*3+i]=pp[i];
for(let i=0;i<ff.length;i++)F[to*3+i]=ff[i]+vo;for(let t=0;t<p.n;t++)C[to+t]=p.col;
for(let t=0;t<p.n;t++){const a=(F[(to+t)*3])*3,b=F[(to+t)*3+1]*3,c=F[(to+t)*3+2]*3,ux=P[b]-P[a],uy=P[b+1]-P[a+1],uz=P[b+2]-P[a+2],vx=P[c]-P[a],vy=P[c+1]-P[a+1],vz=P[c+2]-P[a+2],nx=uy*vz-uz*vy,ny=uz*vx-ux*vz,nz=ux*vy-uy*vx;for(const o of [a,b,c]){N[o]+=nx;N[o+1]+=ny;N[o+2]+=nz}}
vo+=p.v;to+=p.n});
for(let i=0;i<N.length;i+=3){const l=Math.hypot(N[i],N[i+1],N[i+2])||1;N[i]/=l;N[i+1]/=l;N[i+2]/=l}
return {v:nv,n:nt,P,F,C,N}}
const skin=[230,180,150];
const M=[{name:'1.5k body only',m:mk([{...D.body,col:skin}]),n:D.body.n}].concat(D.outfits.map(o=>({name:o.name.replace('male_',''),n:o.n,m:mk([{...D.body,col:skin}].concat(o.parts))})));
const cv=document.getElementById('c'),g=cv.getContext('2d');let ang=.5,sel=-1;const W0=cv.width,H0=cv.height;
function fig(M0,cx,sc,base,wire){const m=M0,ca=Math.cos(ang),sa=Math.sin(ang),nv=m.v,R=new Float32Array(nv*3),P=m.P;
for(let i=0;i<nv;i++){const x=P[3*i],y=P[3*i+1],z=P[3*i+2];R[3*i]=x*ca+z*sa;R[3*i+1]=y;R[3*i+2]=-x*sa+z*ca}
const SH=new Float32Array(nv),N=m.N;for(let i=0;i<nv;i++){const nx=N[3*i]*ca+N[3*i+2]*sa;SH[i]=.3+.7*Math.max(0,(-.4*nx+.5*N[3*i+1]+.75*(-N[3*i]*sa+N[3*i+2]*ca))/.98)}
const F=m.F,vis=[],dep=[];let zmin=1e9,zmax=-1e9;
for(let t=0;t<m.n;t++){const a=F[3*t]*3,b=F[3*t+1]*3,c=F[3*t+2]*3;if((R[b]-R[a])*(R[c+1]-R[a+1])-(R[b+1]-R[a+1])*(R[c]-R[a])<=0)continue;
const z=R[a+2]+R[b+2]+R[c+2]+(m.C[t]===skin?0:900);vis.push(t);dep.push(z);if(z<zmin)zmin=z;if(z>zmax)zmax=z}
const NB=1024,cnt=new Int32Array(NB+1),k=(NB-1)/((zmax-zmin)||1),bk=new Int32Array(vis.length);
for(let i=0;i<vis.length;i++){const q=(dep[i]-zmin)*k|0;bk[i]=q;cnt[q+1]++}
for(let i=0;i<NB;i++)cnt[i+1]+=cnt[i];const ord=new Int32Array(vis.length);for(let i=0;i<vis.length;i++)ord[cnt[bk[i]]++]=vis[i];
const s=sc/30000;g.lineWidth=.5;
for(const t of ord){const a=F[3*t]*3,b=F[3*t+1]*3,c=F[3*t+2]*3,sh=(SH[a/3]+SH[b/3]+SH[c/3])/3,cc=m.C[t],col=`rgb(${cc[0]*sh|0},${cc[1]*sh|0},${cc[2]*sh|0})`;
g.beginPath();g.moveTo(cx+R[a]*s,base-R[a+1]*s);g.lineTo(cx+R[b]*s,base-R[b+1]*s);g.lineTo(cx+R[c]*s,base-R[c+1]*s);g.closePath();g.fillStyle=col;g.fill();g.strokeStyle=wire?'rgba(0,0,0,.45)':col;g.stroke()}}
const tc=getComputedStyle(document.body).color;

g.clearRect(0,0,W0,H0);list.forEach((li,i)=>{fig(M[li].m,cw*(i+.5),sc,H0-40,wire);g.fillStyle=tc;g.font='13px sans-serif';g.textAlign='center';g.fillText(M[li].name+' - '+M[li].n+' tris',cw*(i+.5),H0-12)})}
