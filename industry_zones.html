<!DOCTYPE html>

<title>Specialized Industry</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;font:13px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;color:#22302a;background:#bfdcef}
canvas{display:block}
.panel{position:absolute;background:rgba(255,255,255,.88);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:14px;box-shadow:0 6px 24px rgba(30,50,40,.18);z-index:2}
#bar{top:14px;left:50%;transform:translateX(-50%);display:flex;flex-wrap:wrap;justify-content:center;gap:4px;padding:6px;max-width:calc(100% - 28px)}
#bar button{display:flex;align-items:center;gap:8px;border:0;background:transparent;padding:8px 12px;border-radius:10px;font:inherit;font-weight:600;cursor:pointer;color:#22302a;white-space:nowrap}
#bar button:hover{background:rgba(0,0,0,.06)}
#bar button.on{background:#22302a;color:#fff}
#bar .sep{width:1px;background:rgba(0,0,0,.12);margin:4px 2px}
.sw{width:12px;height:12px;border-radius:4px;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
#help{left:14px;bottom:14px;padding:10px 14px;max-width:min(460px,calc(100% - 28px));color:#3b4a42}
#help b{color:#22302a}
kbd{display:inline-block;font:11px/1 ui-monospace,monospace;padding:3px 5px;border-radius:5px;background:#eef1ee;border:1px solid #d5dbd6;color:#22302a}
#info{right:14px;bottom:14px;padding:14px 16px;width:250px;display:none}
#info .hd{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;margin-bottom:8px}
#info .row{display:flex;justify-content:space-between;gap:10px;padding:3px 0;color:#5a6a61}
#info .row b{color:#22302a;text-align:right}
#info .meter{height:6px;border-radius:3px;background:#e3e8e4;margin:4px 0 6px;overflow:hidden}
#info .meter i{display:block;height:100%;border-radius:3px;background:#5aa04a}
@media (max-width:700px){#info{top:auto;bottom:auto;top:110px;right:14px;width:210px}}
</style></head><body>

<script>
// ---------- renderer / scene ----------
const R=new THREE.WebGLRenderer({antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,2));
R.shadowMap.enabled=true;R.shadowMap.type=THREE.PCFSoftShadowMap;R.toneMapping=THREE.ACESFilmicToneMapping;R.toneMappingExposure=1.05;R.outputEncoding=THREE.sRGBEncoding;

const S=new THREE.Scene();const SKY=0xbfdcef;S.background=new THREE.Color(SKY);S.fog=new THREE.Fog(SKY,180,480);
const C=new THREE.PerspectiveCamera(40,1,.5,1400);

const sun=new THREE.DirectionalLight(0xfff0d8,1.35);sun.castShadow=true;sun.shadow.mapSize.set(4096,4096);
Object.assign(sun.shadow.camera,{left:-90,right:90,top:90,bottom:-90,near:1,far:320});sun.shadow.camera.updateProjectionMatrix();

// ---------- materials ----------
const mc={};function M(c,r=.9,m=0){const k=c+'|'+r+'|'+m;return mc[k]||(mc[k]=new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m,flatShading:true}))}
const P={soil:M(0x7a5a3a),pasture:M(0x9cc964),forestFloor:M(0x5d7a3c),dry:M(0xcdb685),lush:M(0x79ab47),
 benchTop:M(0x9b8a76),benchSide:M(0x9e5e43),benchTop2:M(0xab9a84),benchSide2:M(0xb0704f),ore:M(0x7a4636),rockD:M(0x8a8178),
 asph:M(0x4b4d52,.95),line:M(0xf3efe2),curb:M(0xc9c5bb),gravel:M(0xb3ab9c),conc:M(0xcfcbc2),concD:M(0xa8a399),dirt:M(0xa88a62),
 white:M(0xf3efe6),cream:M(0xefe2c4),red:M(0xbf4a3a),redD:M(0x8f3328),roof:M(0x5b6068,.7),roofR:M(0x8e3b30,.8),roofT:M(0x6d8390,.55,.35),
 metal:M(0xc6cbd0,.4,.55),steel:M(0x7d858c,.5,.6),steelD:M(0x50565c,.55,.5),yellow:M(0xf0b429,.6),orange:M(0xe0702c,.6),blue:M(0x3d6694,.5,.3),blueD:M(0x2b4a6e,.5,.3),
 glass:M(0x33485e,.2,.5),wood:M(0xd2a36a),woodD:M(0x8c6440),bark:M(0x6e4c30),woodEnd:M(0xe6c08e),brick:M(0xa5573f),
 green:M(0x3f8f45,.6),tire:M(0x26272a,.9),pink:M(0xe3a3a0),cowW:M(0xf4f1ea),cowB:M(0x2e2b29),hay:M(0xe2c26a),hayEnd:M(0xf0d890),
 water:M(0x5a9cc4,.15,.1),leaf:M(0x5c9a45),cloud:M(0xffffff,1)};
const PW=M(0xffffff,.9),PJ=M(0x2f5f8a,.6,.2);
const FLAME=new THREE.MeshStandardMaterial({color:0xffb347,emissive:0xff7a1a,emissiveIntensity:2.2,flatShading:true});
const UP=new THREE.Vector3(0,1,0);const V=(x,y,z)=>new THREE.Vector3(x,y,z);
let dt=0;const lerp=(a,b,t)=>a+(b-a)*t;const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
function lerpAng(a,b,t){let d=((b-a+Math.PI)%(Math.PI*2)+Math.PI*2)%(Math.PI*2)-Math.PI;return a+d*t}

// ---------- geometry helpers ----------
function mesh(g,geo,m,x=0,y=0,z=0){const o=new THREE.Mesh(geo,m);o.position.set(x,y,z);o.castShadow=o.receiveShadow=true;g.add(o);return o}
function box(g,w,h,d,m,x,y,z){return mesh(g,new THREE.BoxGeometry(w,h,d),m,x,y+h/2,z)}
function cyl(g,r,h,m,x,y,z,seg=10,rt){return mesh(g,new THREE.CylinderGeometry(rt??r,r,h,seg),m,x,y+h/2,z)}
function cone(g,r,h,m,x,y,z,seg=8){return mesh(g,new THREE.ConeGeometry(r,h,seg),m,x,y+h/2,z)}
function sub(g,x,z,ry=0){const s=new THREE.Group();s.position.set(x,0,z);s.rotation.y=ry;g.add(s);return s}
function prism(g,pts,depth,m,x,y,z,ry=0){const sh=new THREE.Shape(pts.map(p=>new THREE.Vector2(p[0],p[1])));const ge=new THREE.ExtrudeGeometry(sh,{depth,bevelEnabled:false});ge.translate(0,0,-depth/2);const o=mesh(g,ge,m,x,y,z);o.rotation.y=ry;return o}
function gable(g,span,len,h,m,x,y,z,ry=Math.PI/2){return prism(g,[[-span/2,0],[span/2,0],[0,h]],len,m,x,y,z,ry)}
function beam(g,a,b,r,m,seg=6){const v=new THREE.Vector3().subVectors(b,a),L=v.length();const o=mesh(g,new THREE.CylinderGeometry(r,r,L,seg),m);o.position.copy(a).addScaledVector(v,.5);o.quaternion.setFromUnitVectors(UP,v.normalize());return o}
function beamBox(g,a,b,w,h,m){const v=new THREE.Vector3().subVectors(b,a),L=v.length();const o=mesh(g,new THREE.BoxGeometry(L,h,w),m);o.position.copy(a).addScaledVector(v,.5);
 const d=v.clone().normalize();o.rotation.set(0,Math.atan2(-d.z,d.x),Math.asin(clamp(d.y,-1,1)),'YZX');return o}
function wheel(g,x,y,z,r,w){const o=mesh(g,new THREE.CylinderGeometry(r,r,w,10),P.tire,x,y,z);o.rotation.x=Math.PI/2;return o}
const _q=new THREE.Quaternion();function TRS(x,y,z,ry,sx,sy=sx,sz=sx){_q.setFromAxisAngle(UP,ry);return new THREE.Matrix4().compose(V(x,y,z),_q,V(sx,sy,sz))}
const ZERO=new THREE.Matrix4().makeScale(0,0,0);
function inst(g,geo,mat,ms,cols){if(!ms.length)return null;const im=new THREE.InstancedMesh(geo,mat,ms.length);ms.forEach((m,i)=>{im.setMatrixAt(i,m);if(cols)im.setColorAt(i,cols[i])});im.castShadow=im.receiveShadow=true;g.add(im);return im}
const GT={trunk:new THREE.CylinderGeometry(.1,.16,1,5).translate(0,.5,0),c1:new THREE.ConeGeometry(1,1.9,7).translate(0,1.65,0),c2:new THREE.ConeGeometry(.7,1.5,7).translate(0,2.65,0),
 crown:new THREE.IcosahedronGeometry(1,0).scale(1.1,.95,1.1).translate(0,1.9,0),bush:new THREE.IcosahedronGeometry(1,0).translate(0,.45,0),
 stump:new THREE.CylinderGeometry(.18,.22,.35,6).translate(0,.17,0),tuft:new THREE.ConeGeometry(.6,1,4).translate(0,.5,0),
 ridge:new THREE.CylinderGeometry(.5,.5,1,3,1).rotateZ(Math.PI/2).rotateX(-Math.PI/2).translate(0,.25,0),post:new THREE.BoxGeometry(.14,1.1,.14).translate(0,.55,0),
 rock:new THREE.DodecahedronGeometry(1,0).translate(0,.3,0),log:new THREE.CylinderGeometry(.28,.28,1,7),dash:new THREE.BoxGeometry(2,.02,.18)};
Object.values(GT).forEach(g=>g.userData.keep=true);
function clearG(g){for(const o of[...g.children]){g.remove(o);o.traverse(n=>{if(n.isInstancedMesh)n.dispose();if(n.geometry&&!n.geometry.userData.keep)n.geometry.dispose()})}}

// ---------- 2D polygon math (points are [x,z]) ----------
const dot=(p,a)=>p[0]*a[0]+p[1]*a[1];const dist=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]);
function pip(p,poly){let c=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){const a=poly[i],b=poly[j];if(((a[1]>p[1])!=(b[1]>p[1]))&&(p[0]<(b[0]-a[0])*(p[1]-a[1])/(b[1]-a[1])+a[0]))c=!c}return c}
function polyArea(poly){let s=0;for(let i=0,j=poly.length-1;i<poly.length;j=i++)s+=(poly[j][0]+poly[i][0])*(poly[j][1]-poly[i][1]);return Math.abs(s/2)}
function segDist(p,a,b){const dx=b[0]-a[0],dz=b[1]-a[1],l=dx*dx+dz*dz;const t=l?clamp(((p[0]-a[0])*dx+(p[1]-a[1])*dz)/l,0,1):0;return Math.hypot(p[0]-a[0]-dx*t,p[1]-a[1]-dz*t)}
function edgeDist(p,poly){let m=1e9;for(let i=0;i<poly.length;i++)m=Math.min(m,segDist(p,poly[i],poly[(i+1)%poly.length]));return m}
function segX(a,b,c,d){const o=(p,q,r)=>Math.sign((q[0]-p[0])*(r[1]-p[1])-(q[1]-p[1])*(r[0]-p[0]));return o(a,b,c)*o(a,b,d)<0&&o(c,d,a)*o(c,d,b)<0}
function simple(poly){const n=poly.length;if(n<3)return true;for(let i=0;i<n;i++)for(let j=i+1;j<n;j++){if(j===i+1||(i===0&&j===n-1))continue;if(segX(poly[i],poly[(i+1)%n],poly[j],poly[(j+1)%n]))return false}return true}
function rows(poly,u,v,c){const xs=[];for(let i=0,j=poly.length-1;i<poly.length;j=i++){const a=poly[j],b=poly[i];const da=dot(a,v)-c,db=dot(b,v)-c;if((da<0)!==(db<0)){const t=da/(da-db);xs.push(dot(a,u)+t*(dot(b,u)-dot(a,u)))}}xs.sort((p,q)=>p-q);const o=[];for(let k=0;k+1<xs.length;k+=2)o.push([xs[k],xs[k+1]]);return o}
function bounds(poly,d){let lo=1e9,hi=-1e9;for(const p of poly){const x=dot(p,d);lo=Math.min(lo,x);hi=Math.max(hi,x)}return[lo,hi]}
function H(i,j,k=0){const s=Math.sin(i*127.1+j*311.7+k*74.7)*43758.5453;return s-Math.floor(s)}
function scatter(poly,u,v,sp,jit,margin,cb){const[v0,v1]=bounds(poly,v),[u0,u1]=bounds(poly,u);
 for(let j=Math.floor(v0/sp);j<=Math.ceil(v1/sp);j++)for(let i=Math.floor(u0/sp);i<=Math.ceil(u1/sp);i++){const s=(i+.5+(H(i,j,1)-.5)*jit)*sp,c=(j+.5+(H(i,j,2)-.5)*jit)*sp;
  const p=[u[0]*s+v[0]*c,u[1]*s+v[1]*c];if(!pip(p,poly)||(margin>0&&edgeDist(p,poly)<margin))continue;cb(p,i,j)}}
function centroid(poly){let x=0,z=0;for(const p of poly){x+=p[0];z+=p[1]}return[x/poly.length,z/poly.length]}
function polyShape(poly){return new THREE.Shape(poly.map(p=>new THREE.Vector2(p[0],-p[1])))}
function flatPoly(g,poly,mat,y){const ge=new THREE.ShapeGeometry(polyShape(poly));ge.rotateX(-Math.PI/2);const o=new THREE.Mesh(ge,mat);o.position.y=y;o.receiveShadow=true;g.add(o);return o}
function loopPath(pts){const seg=[];let tot=0;for(let i=0;i<pts.length;i++){const a=pts[i],b=pts[(i+1)%pts.length],l=dist(a,b);seg.push({a,b,l,s:tot});tot+=l}
 return{tot,at(d){d=((d%tot)+tot)%tot;for(const q of seg)if(d<=q.s+q.l){const f=q.l?(d-q.s)/q.l:0;return{x:q.a[0]+(q.b[0]-q.a[0])*f,z:q.a[1]+(q.b[1]-q.a[1])*f,ry:Math.atan2(-(q.b[1]-q.a[1]),q.b[0]-q.a[0])}}return{x:pts[0][0],z:pts[0][1],ry:0}}}}

// ---------- props ----------
function wins(g,x,y,z,w,d,mat=P.glass){const cx=Math.max(1,Math.floor(w/1.5)),cz=Math.max(1,Math.floor(d/1.5));
 for(let i=0;i<cx;i++){const xx=x-w/2+(i+.5)*w/cx;box(g,.5,.6,.06,mat,xx,y,z+d/2+.02);box(g,.5,.6,.06,mat,xx,y,z-d/2-.02)}
 for(let i=0;i<cz;i++){const zz=z-d/2+(i+.5)*d/cz;box(g,.06,.6,.5,mat,x+w/2+.02,y,zz);box(g,.06,.6,.5,mat,x-w/2-.02,y,zz)}}
function house(g,x,z,ry,w,d,h,wall,roof){const s=sub(g,x,z,ry);box(s,w+.3,.3,d+.3,P.concD,0,0,0);box(s,w,h,d,wall,0,.3,0);
 gable(s,d+.6,w+.4,1.3,[wall,roof],0,h+.3,0);wins(s,0,1.1,0,w,d);box(s,.8,1.5,.1,P.woodD,w*.22,.3,d/2+.03);box(s,.45,1.5,.45,P.brick,-w*.28,h+.5,-d*.15);return s}
function roundTree(g,x,z,s=1){cyl(g,.12*s,1.2*s,P.bark,x,0,z,5);const l=mesh(g,new THREE.IcosahedronGeometry(1.05*s,0),P.leaf,x,1.9*s,z);l.scale.y=.9;mesh(g,new THREE.IcosahedronGeometry(.7*s,0),M(0x6aa84f),x+.45*s,2.5*s,z-.2*s)}
function sign(g,x,z,col){for(const d of[-.6,.6])box(g,.1,1.3,.1,P.steelD,x+d,0,z);box(g,1.6,.6,.1,col,x,1.0,z);box(g,1.2,.1,.12,P.white,x,1.25,z)}
function fence(g,pts,closed,skipFirst,mat=P.wood){const posts=[],n=pts.length;
 for(let e=skipFirst?1:0;e<(closed?n:n-1);e++){const a=pts[e],b=pts[(e+1)%n];const L=dist(a,b),k=Math.max(1,Math.round(L/2.2));
  for(let i=0;i<k;i++){const f=i/k;posts.push(TRS(a[0]+(b[0]-a[0])*f,0,a[1]+(b[1]-a[1])*f,0,1))}
  for(const y of[.45,.85])beamBox(g,V(a[0],y,a[1]),V(b[0],y,b[1]),.06,.09,mat)}
 const end=closed?pts[0]:pts[n-1];if(!closed||skipFirst)posts.push(TRS(end[0],0,end[1],0,1));inst(g,GT.post,mat,posts)}
function bale(g,x,z,ry){const s=sub(g,x,z,ry);const o=mesh(s,new THREE.CylinderGeometry(.55,.55,.9,9),[P.hay,P.hayEnd,P.hayEnd],0,.55,0);o.rotation.z=Math.PI/2;return s}
function tractor(g,x,z,ry,col=P.green){const s=sub(g,x,z,ry);box(s,2.2,.7,1,col,0,.45,0);box(s,.9,1.1,.95,P.glass,-.45,1.15,0);box(s,1.05,.1,1.1,P.white,-.45,2.25,0);
 wheel(s,-.55,.6,.65,.6,.35);wheel(s,-.55,.6,-.65,.6,.35);wheel(s,.75,.35,.55,.35,.25);wheel(s,.75,.35,-.55,.35,.25);cyl(s,.05,.8,P.tire,.5,1.15,.3,6);return s}
function truck(g,x,z,ry,cab){const s=sub(g,x,z,ry);box(s,5.2,.35,1.5,P.steelD,0,.45,0);box(s,1.4,1.4,1.6,cab,1.9,.7,0);box(s,.06,.6,1.3,P.glass,2.62,1.35,0);
 for(const[a,b]of[[1.9,.8],[1.9,-.8],[-.9,.8],[-.9,-.8],[-1.9,.8],[-1.9,-.8]])wheel(s,a,.42,b,.42,.3);return s}
function haul(g,x,z,ry,col=P.yellow){const s=sub(g,x,z,ry);box(s,3.6,.5,1.9,P.steelD,0,.6,0);box(s,2.5,1.1,2.1,col,-.5,1.1,0);box(s,2.2,.35,1.8,P.ore,-.5,2.15,0);
 box(s,1,.12,2.1,col,1.35,1.1,0);box(s,.9,.8,.8,col,1.35,1.22,.55);box(s,.06,.45,.65,P.glass,1.81,1.5,.55);
 for(const[a,b]of[[1.2,.95],[1.2,-.95],[-1.1,.95],[-1.1,-.95]])wheel(s,a,.6,b,.6,.45);return s}
function excavator(g,x,z,ry,an,col=P.yellow){const s=sub(g,x,z,ry);for(const zz of[-.75,.75])box(s,3,.6,.5,P.tire,0,0,zz);
 const up=new THREE.Group();up.position.y=.7;s.add(up);box(up,2.2,.9,1.7,col,-.2,0,0);box(up,.9,.9,.8,P.glass,.35,.9,.4);box(up,.95,.1,.85,col,.35,1.8,.4);box(up,.6,.7,1.6,P.steelD,-1.15,.1,0);
 beamBox(up,V(.6,.7,-.3),V(2.4,2.4,-.3),.35,.4,col);beamBox(up,V(2.4,2.4,-.3),V(3.3,.4,-.3),.28,.3,col);box(up,.6,.5,.7,P.steelD,3.35,-.55,-.3);
 const ph=x*.37+z*.11;an.push(t=>{up.rotation.y=Math.sin(t*.45+ph)*1.1});return s}
function logPile(g,x,z,ry,n=4,len=4.5){const s=sub(g,x,z,ry);const r=.28;for(let row=0;row<n;row++)for(let i=0;i<n-row;i++){const o=mesh(s,GT.log,[P.bark,P.woodEnd,P.woodEnd],(i-(n-row-1)/2)*2*r,r+row*r*1.72,0);o.rotation.x=Math.PI/2;o.scale.y=len*(.92+H(i,row)*.12)}return s}
function lumber(g,x,z,ry){const s=sub(g,x,z,ry);for(let k=0;k<3;k++){box(s,2.8,.45,1.6,P.wood,0,k*.55,0);box(s,2.8,.1,.12,P.woodD,0,k*.55+.45,-.6);box(s,2.8,.1,.12,P.woodD,0,k*.55+.45,.6)}return s}
function cow(g){const c=sub(g,0,0,0);const w=P.cowW,b=P.cowB;box(c,1.3,.62,.62,w,0,.5,0);box(c,.42,.64,.64,b,-.12,.49,0);box(c,.26,.3,.645,b,.38,.78,0);
 for(const[a,d]of[[.48,.2],[.48,-.2],[-.48,.2],[-.48,-.2]])box(c,.14,.52,.14,w,a,0,d);beamBox(c,V(-.65,.95,0),V(-.78,.4,0),.05,.05,b);
 const hd=new THREE.Group();hd.position.set(.72,.95,0);c.add(hd);box(hd,.42,.36,.34,w,.14,-.3,0);box(hd,.14,.2,.3,P.pink,.38,-.33,0);
 for(const s of[-1,1]){box(hd,.06,.14,.06,P.cream,.05,.06,s*.13);box(hd,.08,.08,.2,b,0,-.08,s*.24)}c.userData.head=hd;c.scale.setScalar(.9);return c}
function combine(g){const s=sub(g,0,0,0);const body=M(0xd24b32,.55);box(s,2.6,1.3,1.5,body,-.2,.55,0);box(s,1.1,.9,1.3,body,-.65,1.85,0);
 box(s,.9,.85,.95,P.glass,.55,1.85,0);box(s,1,.1,1.05,P.white,.55,2.7,0);box(s,.7,.35,3.6,P.yellow,1.55,.25,0);
 const reel=new THREE.Group();reel.position.set(1.8,1,0);s.add(reel);for(let i=0;i<5;i++){const a=i/5*Math.PI*2;mesh(reel,new THREE.BoxGeometry(.08,.08,3.4),P.yellow,Math.cos(a)*.38,Math.sin(a)*.38,0)}

function keysPan(){const s=600*dt;if(keys.w)pan(0,s);if(keys.s)pan(0,-s);if(keys.a)pan(s,0);if(keys.d)pan(-s,0);if(keys.q)cam.yaw+=dt*1.2;if(keys.e)cam.yaw-=dt*1.2}

// ---------- UI ----------
const hex=c=>'#'+('000000'+c.toString(16)).slice(-6);const bar=document.getElementById('bar');
function updateBar(){bar.innerHTML='';Object.entries(TYPES).forEach(([k,t],i)=>{const b=document.createElement('button');b.innerHTML=`<span class="sw" style="background:${hex(t.color)}"></span>${t.name}`;b.title=`Key ${i+1}`;
  if((ghost||drawing||{}).type===k&&mode!=='idle')b.classList.add('on');b.onclick=()=>pickType(k);bar.appendChild(b)});
 const sp=document.createElement('div');sp.className='sep';bar.appendChild(sp);const r=document.createElement('button');r.textContent='Resources';if(showAllRes)r.classList.add('on');r.onclick=()=>{showAllRes=!showAllRes;showOverlay(mode==='idle'?null:(ghost||drawing||{}).type);updateBar()};bar.appendChild(r)}
function setMode(m){mode=m;updateBar();const h=document.getElementById('help');
 h.innerHTML=m==='place'?`<b>Place the ${TYPES[ghost.type].name.toLowerCase()}.</b> Slide along the road and click. Its work area starts from the back of the lot. <kbd>Esc</kbd> cancels.`
 :m==='draw'?`<b>Draw the work area.</b> It starts from the edge behind the building. Click to add a corner and drag the shape out. Click the first node, click the same spot twice, or press <kbd>Enter</kbd> to finish. <kbd>Backspace</kbd> removes a corner.`
 :`Pick an industry above or press <kbd>1</kbd>–<kbd>5</kbd>. Click an industry to select it, drag its white nodes, and click an edge to add a node. <kbd>Del</kbd> removes it. Drag to orbit, <kbd>Shift</kbd>+drag or <kbd>WASD</kbd> to pan, scroll to zoom, <kbd>R</kbd> shows resources.`;updateInfo()}
function updateInfo(){const ind=drawing||sel||ghost;const el=document.getElementById('info');if(!ind){el.style.display='none';return}el.style.display='block';const t=TYPES[ind.type];
 const st=ind===ghost?null:stats(ind,ind===drawing?cursor:null);
 el.innerHTML=`<div class="hd"><span class="sw" style="background:${hex(t.color)}"></span>${t.name}</div><div class="row"><span>Needs</span><b>${t.resName}</b></div><div class="row"><span>Produces</span><b>${t.out}</b></div>`+
 (st?`<div class="row"><span>Area</span><b>${st.ha.toFixed(2)} ha</b></div>`+(t.res?`<div class="row"><span>On ${t.resName.toLowerCase()}</span><b>${Math.round(st.cov*100)}%</b></div><div class="meter"><i style="width:${st.cov*100}%;background:${st.cov<.5?'#d9873a':'#5aa04a'}"></i></div>`:'')+`<div class="row"><span>Output</span><b>${st.out.toFixed(1)} t / month</b></div>`:'')}

// ---------- demo layout ----------
function demo(type,x,side,pts){const ind=makeIndustry(type);placeAt(ind,x,side);ind.pts=pts.map(([a,b])=>[x+a,b]);inds.push(ind);buildArea(ind);buildHandles(ind);ind.handles.visible=false}
demo('grain',-48,-1,[[14,-24],[12,-50],[-10,-56],[-18,-30]]);
demo('timber',-12,-1,[[12,-26],[9,-52],[-6,-58],[-13,-40],[-10,-24]]);
demo('oil',24,-1,[[10,-30],[7,-52],[-10,-54],[-12,-28]]);
demo('ore',58,-1,[[10,-26],[12,-44],[-2,-50],[-14,-42],[-9,-24]]);
demo('livestock',-20,1,[[-16,26],[-14,46],[8,50],[18,30]]);
refreshWild();setMode('idle');

// ---------- loop ----------
const clock=new THREE.Clock();
(function loop(){dt=Math.min(clock.getDelta(),.05);const t=clock.elapsedTime;keysPan();camUpdate();
 for(const o of inds){o.anims.forEach(f=>f(t));o.areaAnims.forEach(f=>f(t))}if(ghost)ghost.anims.forEach(f=>f(t));
 const hs=Math.max(.8,cam.dist/90);for(const o of inds)o.handles.children.forEach(h=>{h.scale.setScalar(hs);h.rotation.y=t})
 for(const c of clouds){c.position.x+=dt*2;if(c.position.x>260)c.position.x=-260}
 R.render(S,C);requestAnimationFrame(loop)})();
</script></body></html>
