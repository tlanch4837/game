function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

function show(n){if(cur)S.remove(cur);if(!cache[n]){const t0=texCount;cache[n]=new THREE.Group();B[n][1](cache[n]);cache[n].userData.tex=texCount-t0}cur=cache[n];S.add(cur);
 const bb=new THREE.Box3().setFromObject(cur),sz=bb.getSize(new THREE.Vector3());dist=Math.max(sz.x,sz.z)*1.05;bb.getCenter(tgt);tgt.y=2;const half=Math.max(sz.x,sz.z)*0.6;Object.assign(sun.shadow.camera,{left:-half,right:half,top:half,bottom:-half,near:1,far:half*6});sun.shadow.camera.updateProjectionMatrix();sun.position.set(tgt.x+half*1.2,half*1.9,tgt.z+half*0.9);sun.target.position.copy(tgt);sun.target.updateMatrixWorld();sun.shadow.normalBias=0.02*half/40;S.fog.near=dist*1.2;S.fog.far=dist*4;const st=stats(cur);

 [...ui.children].forEach(b=>b.classList.toggle('on',b.textContent===n));document.getElementById('load').style.display='none'}

onpointermove=e=>{if(!drag)return;ang-=(e.clientX-px)*0.008;el=Math.min(1.45,Math.max(0.08,el+(e.clientY-py)*0.006));px=e.clientX;py=e.clientY};
