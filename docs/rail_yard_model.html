<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Train depot - 5 through tracks</title>
<style>html,body{margin:0;height:100%;background:#9fb8c8;overflow:hidden;font:13px sans-serif}
#i{position:fixed;left:10px;top:8px;color:#123;background:#fffa;padding:4px 8px;border-radius:4px}</style></head>
<body><div id="i">Train depot: 5 flat tracks through a garage, entrance each end (spawn / exit). Drag = orbit, wheel = zoom. <span id="t"></span></div>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const R=new THREE.WebGLRenderer({antialias:true});R.setSize(innerWidth,innerHeight);document.body.appendChild(R.domElement);
const sc=new THREE.Scene();sc.background=new THREE.Color(0x9fb8c8);
const cam=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.1,600);cam.position.set(-45,28,45);
const oc=new OrbitControls(cam,R.domElement);oc.maxPolarAngle=Math.PI*.49;
sc.add(new THREE.HemisphereLight(0xdfeaff,0x58603f,1.1));
const sun=new THREE.DirectionalLight(0xfff2d8,2);sun.position.set(-30,60,30);sc.add(sun);
const M=c=>new THREE.MeshLambertMaterial({color:c,flatShading:true});
const mat={ground:M(0x56653d),bed:M(0x77726a),rail:M(0xc0c3c8),wall:M(0xa8a39a),roof:M(0x5a5f66),trim:M(0xd8a928),mark:M(0x3fd16a),dark:M(0x2b2b2e)};
const box=(w,h,d,m,x,y,z)=>{const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);sc.add(o);return o};
const flat=(w,d,m,x,y,z)=>{const o=new THREE.Mesh(new THREE.PlaneGeometry(w,d),m);o.rotation.x=-Math.PI/2;o.position.set(x,y,z);sc.add(o);return o};
// layout: 5 tracks along X, 5 m spacing; depot 40 m long
const Z=[-10,-5,0,5,10],LEN=40,APP=30,W=29,H=9;
flat(400,400,mat.ground,0,0,0);
// tracks: flat strips on the plane (bed + two rail lines), continuing out of both entrances
for(const z of Z){flat(LEN+APP*2,3.2,mat.bed,0,.02,z);for(const s of[-1,1])flat(LEN+APP*2,.2,mat.rail,0,.04,z+s*.72)}
// building: two side walls, roof, end walls made of pillars + lintel leaving 5 openings (4 m wide, 6 m high)
const OPEN=4.4,OH=6.2;
box(LEN,H,.6,mat.wall,0,H/2,-W/2);box(LEN,H,.6,mat.wall,0,H/2,W/2);
box(LEN+1.2,.6,W+1.2,mat.roof,0,H+.3,0);
for(const x of[-LEN/2,LEN/2]){
 box(.6,H-OH,W,mat.wall,x,OH+(H-OH)/2,0);                      // lintel across the 5 openings
 box(.8,.5,W+.6,mat.trim,x,OH,0);                              // trim strip over the doors
 const edges=[-W/2,...Z.flatMap(z=>[z-OPEN/2,z+OPEN/2]),W/2];
 for(let i=0;i<edges.length;i+=2){const a=edges[i],b=edges[i+1],w=b-a;if(w>.05)box(.6,OH,w,mat.wall,x,OH/2,(a+b)/2)} // pillars
 // spawn / exit markers: flat green pad just outside each portal
 for(const z of Z)flat(3,OPEN-1,mat.mark,x+(x<0?-3:3),.06,z);
}
box(LEN-1,.2,W-1,mat.dark,0,.03,0);                              // dark floor inside (under the tracks' flat strips)
for(const z of Z){flat(LEN,3.2,mat.bed,0,.07,z);for(const s of[-1,1])flat(LEN,.2,mat.rail,0,.08,z+s*.72)}
let n=0;sc.traverse(o=>{if(o.isMesh)n+=(o.geometry.index?o.geometry.index.count:o.geometry.attributes.position.count)/3});
document.getElementById('t').textContent='~'+n+' triangles';
addEventListener('resize',()=>{R.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()});
(function loop(){oc.update();R.render(sc,cam);requestAnimationFrame(loop)})();
</script></body></html>
