<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Rail junctions - procedural models (preview)</title>
<style>
html,body{margin:0;height:100%;background:#9fb8c8;overflow:hidden;font:13px system-ui,sans-serif;color:#123}
#ui{position:fixed;left:10px;top:10px;width:300px;background:#ffffffe8;padding:10px 12px;border-radius:8px;box-shadow:0 2px 10px #0003}
#ui h1{font-size:15px;margin:0 0 6px}#ui label{display:flex;align-items:center;gap:6px;margin:5px 0}
#ui label span{width:92px}#ui input[type=range]{flex:1}#ui output{width:44px;text-align:right;font-variant-numeric:tabular-nums}
#ui select{flex:1}#stats{margin-top:8px;padding-top:6px;border-top:1px solid #ccd;font-variant-numeric:tabular-nums;white-space:pre;font-family:ui-monospace,monospace;font-size:12px}
#note{color:#a33;min-height:1em}
#tbl{position:fixed;right:10px;top:10px;background:#ffffffe8;padding:8px 10px;border-radius:8px;box-shadow:0 2px 10px #0003;font:12px ui-monospace,monospace}
#tbl table{border-collapse:collapse}#tbl td,#tbl th{padding:1px 6px;text-align:right}#tbl td:first-child,#tbl th:first-child{text-align:left}
.lbl{position:fixed;transform:translate(-50%,-100%);background:#fffd;padding:2px 6px;border-radius:4px;font:12px system-ui;white-space:nowrap;pointer-events:none}
</style></head>
<body>
<div id="ui">
 <h1>Rail junctions (procedural)</h1>
 <div>Generated from parameters, same algorithm as <code>src/city/rail_junction_mesh.h</code>. Drag = orbit, wheel = zoom.</div>
 <label><span>View</span><select id="view"><option value="one">One junction</option><option value="all">All types (grid)</option></select></label>
 <label><span>Type</span><select id="type">
  <option value="Turnout">Turnout</option><option value="Wye">Wye</option><option value="ThreeWay">3-way</option>
  <option value="Diamond">Diamond crossing</option><option value="SingleSlip">Single slip</option>
  <option value="Crossover">Crossover</option><option value="Scissors">Scissors crossover</option>
  <option value="LevelCrossing">Level crossing</option></select></label>
 <label><span>Hand</span><select id="hand"><option value="Right">Right</option><option value="Left">Left</option></select></label>
 <label><span>Angle (deg)</span><input id="angle" type="range" min="2" max="90" step="0.5" value="12"><output id="angleO"></output></label>
 <label><span>Radius (m)</span><input id="radius" type="range" min="30" max="400" step="5" value="150"><output id="radiusO"></output></label>
 <label><span>Spacing (m)</span><input id="spacing" type="range" min="3" max="14" step="0.1" value="5"><output id="spacingO"></output></label>
 <label><span>Road width</span><input id="road" type="range" min="4" max="30" step="0.5" value="9"><output id="roadO"></output></label>
 <label><span>Tail (m)</span><input id="tail" type="range" min="0" max="30" step="1" value="6"><output id="tailO"></output></label>
 <label><span>Gauge (m)</span><input id="gauge" type="range" min="1" max="1.7" step="0.005" value="1.435"><output id="gaugeO"></output></label>
 <label><span>LOD</span><select id="lod"><option value="0">LOD 0 (near)</option><option value="1">LOD 1 (distance)</option></select></label>
 <label><input id="wire" type="checkbox"> wireframe <input id="tex" type="checkbox" checked> textures</label>
 <div id="note"></div>
 <div id="stats"></div>
</div>
<div id="tbl"></div>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
<script type="module" src="rail_junction_view.js"></script>
</body></html>
