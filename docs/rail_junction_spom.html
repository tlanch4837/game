<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Rail junctions - SPOM planes (engine path preview)</title>
<style>
html,body{margin:0;height:100%;background:#9fb8c8;overflow:hidden;font:13px system-ui,sans-serif;color:#123}
#ui{position:fixed;left:10px;top:10px;width:290px;background:#ffffffe8;padding:10px 12px;border-radius:8px;box-shadow:0 2px 10px #0003}
#ui h1{font-size:15px;margin:0 0 6px}#ui label{display:flex;align-items:center;gap:6px;margin:5px 0}
#ui label span{width:86px}#ui select,#ui input[type=range]{flex:1}
#stats{margin-top:8px;padding-top:6px;border-top:1px solid #ccd;white-space:pre;font:12px ui-monospace,monospace}
</style></head>
<body>
<div id="ui">
 <h1>Rail junctions: flat SPOM planes</h1>
 <div>Each junction is one 10-triangle box, shaded by parallax occlusion against its baked height map
 (<code>tools/rail_junction_tex</code>), like the plain track (TrackPS). Plain track continues at every open end.
 Drag = orbit, wheel = zoom. <a href="rail_junction_preview.html">Geometry preview</a></div>
 <label><span>Layout</span><select id="layout"></select></label>
 <label><span>Hand</span><select id="hand"><option>Right</option><option>Left</option></select></label>
 <label><span>Gates</span><input id="gate" type="range" min="0" max="1" step="0.05" value="0"></label>
 <label><span>Steps</span><select id="steps"><option value="48">48 (TrackPS: 40)</option><option value="64">64</option><option value="0">0 (flat, far LOD)</option></select></label>
 <label><input id="plain" type="checkbox" checked> plain track beside <input id="wire" type="checkbox"> wireframe</label>
 <div id="stats"></div>
</div>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
<script type="module" src="rail_junction_spom.js"></script>
</body></html>
