<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Crane viewer</title>
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
<style>html,body{margin:0;height:100%;background:#8fb4d6}model-viewer{width:100%;height:100%}</style></head>
<body>
<model-viewer id="mv" src="crane.glb" camera-controls auto-rotate="false" shadow-intensity="1"
  camera-orbit="35deg 75deg 120m" camera-target="8m 30m 0m" field-of-view="35deg"
  min-camera-orbit="auto auto 5m" max-camera-orbit="auto auto 400m" exposure="1.1"></model-viewer>
</body></html>
