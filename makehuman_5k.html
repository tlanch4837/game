function dec(b,T){const s=atob(b),u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return new T(u.buffer)}
const LV=D.lv.slice(1).map(l=>({name:l.name,n:l.n,v:l.v,P:Float32Array.from(dec(l.p,Int16Array)),F:dec(l.f,Uint16Array)}));LV.forEach(m=>{const N=new Float32Array(m.v*3),P=m.P,F=m.F;for(let t=0;t<F.length;t+=3){const a=F[t]*3,b=F[t+1]*3,c=F[t+2]*3,ux=P[b]-P[a],uy=P[b+1]-P[a+1],uz=P[b+2]-P[a+2],vx=P[c]-P[a],vy=P[c+1]-P[a+1],vz=P[c+2]-P[a+2],nx=uy*vz-uz*vy,ny=uz*vx-ux*vz,nz=ux*vy-uy*vx;for(const o of [a,b,c]){N[o]+=nx;N[o+1]+=ny;N[o+2]+=nz}}for(let i=0;i<N.length;i+=3){const l=Math.hypot(N[i],N[i+1],N[i+2])||1;N[i]/=l;N[i+1]/=l;N[i+2]/=l}m.N=N});
const cv=document.getElementById('c'),g=cv.getContext('2d');let ang=.5,sel=0;
const W0=cv.width,H0=cv.height;
function fig(m,cx,sc,base,wire){const ca=Math.cos(ang),sa=Math.sin(ang),nv=m.v,R=new Float32Array(nv*3),P=m.P;
for(let i=0;i<nv;i++){const x=P[3*i],y=P[3*i+1],z=P[3*i+2];R[3*i]=x*ca+z*sa;R[3*i+1]=y;R[3*i+2]=-x*sa+z*ca}
const SH=new Float32Array(nv),N=m.N;for(let i=0;i<nv;i++){const nx=N[3*i]*ca+N[3*i+2]*sa,nz=-N[3*i]*sa+N[3*i+2]*ca;SH[i]=.3+.7*Math.max(0,(-.4*nx+.5*N[3*i+1]+.75*nz)/.98)}const F=m.F,nt=F.length/3,vis=[],dep=[];let zmin=1e9,zmax=-1e9;
for(let t=0;t<nt;t++){const a=F[3*t]*3,b=F[3*t+1]*3,c=F[3*t+2]*3;
const ux=R[b]-R[a],uy=R[b+1]-R[a+1],vx=R[c]-R[a],vy=R[c+1]-R[a+1];
if(ux*vy-uy*vx<=0)continue;
const z=R[a+2]+R[b+2]+R[c+2];vis.push(t);dep.push(z);if(z<zmin)zmin=z;if(z>zmax)zmax=z}
const NB=512,cnt=new Int32Array(NB+1),k=(NB-1)/((zmax-zmin)||1),bk=new Int32Array(vis.length);
for(let i=0;i<vis.length;i++){const q=(dep[i]-zmin)*k|0;bk[i]=q;cnt[q+1]++}
for(let i=0;i<NB;i++)cnt[i+1]+=cnt[i];
const ord=new Int32Array(vis.length);for(let i=0;i<vis.length;i++)ord[cnt[bk[i]]++]=vis[i];
const s=sc/30000;g.lineWidth=.5;
for(let j=0;j<ord.length;j++){const t=ord[j],a=F[3*t]*3,b=F[3*t+1]*3,c=F[3*t+2]*3;
const ux=R[b]-R[a],uy=R[b+1]-R[a+1],uz=R[b+2]-R[a+2],vx=R[c]-R[a],vy=R[c+1]-R[a+1],vz=R[c+2]-R[a+2];
const nx=uy*vz-uz*vy,ny=uz*vx-ux*vz,nz=ux*vy-uy*vx,l=Math.hypot(nx,ny,nz)||1;
const sh=(SH[a/3]+SH[b/3]+SH[c/3])/3,col=`rgb(${230*sh|0},${180*sh|0},${150*sh|0})`;
g.beginPath();g.moveTo(cx+R[a]*s,base-R[a+1]*s);g.lineTo(cx+R[b]*s,base-R[b+1]*s);g.lineTo(cx+R[c]*s,base-R[c+1]*s);g.closePath();
g.fillStyle=col;g.fill();g.strokeStyle=wire?'rgba(40,20,10,.5)':col;g.stroke()}}
const tc=getComputedStyle(document.body).color;
function draw(){const wire=document.getElementById('wire').checked,list=sel<0?[0,1,2,3,4,5]:[sel],cw=W0/list.length,sc=Math.min(cw*.8,(H0-60)*.8);
g.clearRect(0,0,W0,H0);list.forEach((li,i)=>{const m=LV[li];fig(m,cw*(i+.5),sc,H0-40,wire);g.fillStyle=tc;g.font='15px sans-serif';g.textAlign='center';g.fillText('Decimated'+' - '+m.n.toLocaleString()+' tris',cw*(i+.5),H0-12)})}
const bx=document.getElementById('b');['All','5k','1.5k','1k','500','350','375'].forEach((l,i)=>{const e=document.createElement('button');e.textContent=l;e.onclick=()=>{sel=i-1;draw()};bx.appendChild(e)});
let dr=false,lx=0;cv.onpointerdown=e=>{dr=true;lx=e.clientX;document.getElementById('a').checked=false;cv.setPointerCapture(e.pointerId)};
cv.onpointerup=()=>dr=false;cv.onpointermove=e=>{if(dr){ang+=(e.clientX-lx)*.01;lx=e.clientX;draw()}};
document.getElementById('wire').onchange=draw;
(function loop(){if(document.getElementById('a').checked){ang+=.02;draw()}requestAnimationFrame(loop)})();draw();</script>
